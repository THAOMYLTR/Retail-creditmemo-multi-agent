# =============================================================================
# DOCUMENT CLASSIFICATION MATRIX — RETAIL (KHÁCH HÀNG CÁ NHÂN)
# (dossier group -> document type -> agents)
# =============================================================================
# THIS IS THE SOURCE OF TRUTH for document routing. Editing this file changes
# which document reaches which agent — no Python change required.
#
# It describes the dossier of an INDIVIDUAL borrower (khách hàng cá nhân, KHCN):
# identity and residence papers, proof of income, the loan application with
# its repayment plan, the purpose documents (house/car purchase contract), the
# collateral papers, CIC reports and the bank's own appraisal/verification
# report.
#
# --- How to read a `type` ----------------------------------------------------
#   id        : technical key, never changed (it is written into logs/monitoring).
#   label     : the document line as it appears on the dossier checklist.
#   short_label : a caption for the reader of the finished memo.
#   keywords  : terms that identify this type from the FILENAME and the CONTENT.
#               Written unaccented and lowercase. The system strips accents and
#               lowercases both keywords and text before comparing, so accented
#               spellings work too; unaccented is the convention here so the form
#               actually being compared is visible.
#               A filename hit scores 3x a content hit.
#   agents    : which agents use this type, with an R/O level.
#                 R = Required — core evidence, gets budget priority.
#                 O = Optional — used when present, ranked after R.
#               A scalar value (`R`) = identical across all loan products.
#               A map value = per-product, and MUST list every product.
#   requirement : "Cấp mới"/"Tái cấp" columns of the checklist. NOT wired into
#               any logic yet; kept for a future missing-document checklist.
#   income_extraction : true = run the proof-of-income pass that turns the
#               document into a structured monthly income record
#               (src/agents/income_extraction.py). Feeds the affordability
#               calculator (DTI/DSR) and the debt/income chart.
#   proposal_extraction : true = extract the loan application / repayment plan
#               (src/agents/proposal_extraction.py).
#   cic_s10a_extraction : true = extract the CIC credit report of the borrower
#               (src/agents/cic_s10a_extraction.py). The flag keeps its original
#               name; it now covers the individual credit report as well.
#   cic_r21_extraction : true = extract the CIC loan-collateral report
#               (src/agents/cic_r21_extraction.py).
#   sitevisit_extraction : true = extract the appraisal / field verification
#               report (src/agents/sitevisit_extraction.py).
#               EACH flag costs one extra LLM call per matching document.
#
# --- Choosing the primary agent ----------------------------------------------
# `primary_agent` is declared at group level and applies to every type in the
# group. When that agent is absent from a type's `agents`, the first R-level
# agent wins, in the order CP > CR > IA > PF > RA (see PRIMARY_AGENT_PRECEDENCE
# in document_matrix.py). It can be overridden per type.
# =============================================================================

version: 1

# The retail loan products. Each column decides how strongly a document is
# needed for that product: a land-use-right certificate is core evidence for a
# mortgage and merely supporting for an unsecured consumer loan.
#
# `aliases` = how a user might name the product in a question. The system looks
# for these phrases in the prompt to pick the right column (see
# detect_loan_program). Aliases are normalised exactly like document keywords:
# accents stripped, lowercased, every non-alphanumeric character turned into a
# space. Matching is whole-token. An alias may point at only one product; a
# duplicate is an error at load time.
#
# The same ids key src/policy/retail_products.yaml, which holds each product's
# policy limits (max DSR, max LTV, max tenor...).
loan_programs:
  - id: TIEU_DUNG
    label: "Vay tiêu dùng tín chấp"
    aliases: ["tin chap", "vay tin chap", "tieu dung tin chap", "vay tieu dung", "unsecured", "personal loan"]
  - id: MUA_NHA
    label: "Vay mua nhà / bất động sản"
    aliases: ["mua nha", "vay mua nha", "mua can ho", "mua dat", "mua bat dong san", "vay mua bat dong san", "xay sua nha", "mortgage", "home loan"]
  - id: MUA_O_TO
    label: "Vay mua ô tô"
    aliases: ["mua o to", "vay mua o to", "mua oto", "mua xe", "vay mua xe", "auto loan", "car loan"]
  - id: HO_KINH_DOANH
    label: "Vay hộ kinh doanh"
    aliases: ["ho kinh doanh", "vay ho kinh doanh", "hkd", "tieu thuong", "vay kinh doanh ca nhan"]

